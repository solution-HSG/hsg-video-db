<title>HSG 영상 DB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;800;900&family=Montserrat:wght@700;800&display=swap">
<style>
/* Layout: a library card catalogue — sticky top bar with tabs, a filter rail beside a dense record list, a record sheet that slides in from the right. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --line:#d6dde4; --fg:#16212c; --muted:#5b6977;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e1edf6;
  --p:#2f7a55; --p-soft:#e2f1e8; --h:#1f5f8b; --h-soft:#e1edf6; --c:#7a4a8f; --c-soft:#f0e6f4;
  --warn:#a35d00; --warn-soft:#fdf0dc; --bad:#b3362c; --bad-soft:#fbe5e3; --good:#2f7a55;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --sunk:#1c2833; --line:#2b3a48; --fg:#e4ebf1; --muted:#93a3b2;
  --accent:#6fb0de; --accent-ink:#0b141c; --accent-soft:#1c3446;
  --p:#7cc79f; --p-soft:#1b3428; --h:#6fb0de; --h-soft:#1c3446; --c:#c49ad6; --c-soft:#33253b;
  --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#7cc79f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --sunk:#1c2833; --line:#2b3a48; --fg:#e4ebf1; --muted:#93a3b2;
  --accent:#6fb0de; --accent-ink:#0b141c; --accent-soft:#1c3446;
  --p:#7cc79f; --p-soft:#1b3428; --h:#6fb0de; --h-soft:#1c3446; --c:#c49ad6; --c-soft:#33253b;
  --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#f08a80; --bad-soft:#3d1f1c; --good:#7cc79f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{background:var(--sunk);color:var(--fg)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.who{margin-left:auto;font-size:12px;color:var(--muted)}
main{padding-block:20px 60px}
h1{font-size:20px;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:500}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.searchrow .q{flex:1 1 320px;min-width:0}
.searchrow .q input{font-size:15px;padding:10px 12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:4px}
.resultbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.kwbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--surface)}
.kwbox:focus-within{border-color:var(--accent)}
.kwbox input{border:0;padding:4px;flex:1;min-width:140px;width:auto}
.kwbox input:focus{outline:none}
.pill.exk{cursor:pointer;background:var(--surface)}
.pill.exk:hover{border-color:var(--accent);color:var(--accent)}
.rec{gap:16px}
.rec-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rec-title{font-size:19px;margin-top:2px}
.rec-total{display:flex;flex-direction:column;align-items:flex-end;background:var(--accent-soft);border-radius:var(--r);padding:8px 14px}
.rec-total b{font-family:var(--f-mono);font-size:20px;color:var(--accent)}
.rec-step-h{display:flex;gap:10px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap}
.rec-no{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.mod-cell{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row{display:grid;grid-template-columns:136px minmax(0,1fr) 128px 64px 60px 92px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.head{cursor:default;background:var(--sunk);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:7px}
.row .t{min-width:0}
.row .t b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
.code{font-family:var(--f-mono);font-weight:600;font-size:12.5px;padding:2px 7px;border-radius:5px;display:inline-block;white-space:nowrap}
.code.P{background:var(--p-soft);color:var(--p)}.code.H{background:var(--h-soft);color:var(--h)}.code.C{background:var(--c-soft);color:var(--c)}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;display:inline-block;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.ok{color:var(--good)}
.pill.pv{background:var(--p-soft);color:var(--p);border-color:transparent;font-weight:500}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.more{display:flex;justify-content:center;padding:12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .row{grid-template-columns:72px minmax(0,1fr) 52px;}
  .row .hide-s{display:none}
}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.35);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{display:flex;gap:10px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-h .grow{flex:1;min-width:0}
.sheet-b{overflow:auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dl.meta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;margin:0}
dl.meta dt{color:var(--muted);font-size:13px}
dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.summary{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.summary h2{font-size:16px;font-weight:700;color:var(--accent);margin:0 0 6px}
.summary p{margin:0}
.summary p.pre::first-line{font-weight:600}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted)}
.chipin{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.chip button{border:0;background:transparent;padding:0 6px;color:var(--muted)}
/* modules */
.mgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:70vh;overflow:auto}
.mlist button{display:flex;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);border-radius:0;padding:9px 14px;text-align:left;font-weight:500}
.mlist button:first-child{border-top:0}
.mlist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.mlist .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.step{display:grid;grid-template-columns:32px 92px minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .pos{font-family:var(--f-mono);color:var(--muted);text-align:right}
.step.clickable{cursor:pointer}.step.clickable:hover{background:var(--sunk)}
@media (max-width:560px){.step{grid-template-columns:24px 78px minmax(0,1fr)}}
/* check */
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.reasons button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notice{background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:13px}
.notice.info{background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;color:var(--fg);text-decoration:none;min-width:0}
a.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.vimeo-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vimeo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(40px,1fr) 2.2em 5.5em;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar-f{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar-f.zero{background:transparent}
.bar-n{font-family:var(--f-mono);text-align:right;font-weight:600}
.bar-s{color:var(--muted);font-size:12px;white-space:nowrap}
.to-top{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:44px;height:44px;border-radius:999px;padding:0;justify-content:center;background:var(--surface);color:var(--accent);border:1px solid var(--line);box-shadow:0 2px 10px rgba(10,18,26,.15)}
.to-top:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:40;font-size:13px}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.inst-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px 10px}
@media (max-width:1100px){.inst-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media (max-width:900px){.inst-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:600px){.inst-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.inst-cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.inst-cell .mono{font-size:12px;color:var(--muted,inherit)}
.inst-cell input{width:100%;min-width:0}
/* ---- 영상 카달로그 ---- */
.cat-aud{display:grid;grid-template-columns:1fr 130px;gap:12px;min-width:0}
.cat-hc{display:flex;align-items:center;gap:6px}
.cat-hc em{font-style:normal;color:var(--muted)}
.cat-counts{display:grid;grid-template-columns:repeat(3,minmax(0,190px));gap:10px;margin-top:4px}
.cat-counts .cc{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.cc-in{display:grid;grid-template-columns:1fr 78px;gap:6px}
.cc-in input,.cc-in select{width:100%}
@media (max-width:560px){.cat-counts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat-logo-prev{height:36px;max-width:160px;object-fit:contain;background:#55348b;padding:6px 10px;border-radius:6px}
.cat-out{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.cat-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.cat-bar>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-slides{display:flex;flex-direction:column;gap:14px}
.sl-wrap{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);--s:.5}
.sl-scale{width:1280px;height:720px;transform:scale(var(--s));transform-origin:0 0}
.cat-capture{position:fixed;left:-30000px;top:0;width:1280px}
.cat-slides [contenteditable]{outline:1px dashed transparent;border-radius:3px;cursor:text}
.cat-slides [contenteditable]:hover{outline-color:rgba(85,52,139,.45)}
.cat-slides [contenteditable]:focus{outline:2px solid #55348b;background:rgba(255,255,255,.6)}
.sl-cover .cv-l [contenteditable]:focus{background:rgba(255,255,255,.12)}
.sl{--pu:#55348b;--pu-soft:#efe9f7;--ink:#26222e;--sub:#6c6676;width:1280px;height:720px;position:relative;overflow:hidden;font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-size:16px;line-height:1.5;letter-spacing:-.01em;color-scheme:light}
.sl *{box-sizing:border-box}
.sl-light{background:#f4f2f8;padding:56px 56px 0}
.sl .card{background:#fff;border-radius:16px}
.sl .badge{display:inline-flex;align-items:center;background:var(--pu);color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:3px 14px;line-height:1.5}
.sl-h1{font-size:34px;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--ink)}
.sl-foot{position:absolute;left:56px;right:56px;bottom:28px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--sub)}
.sl-foot b{color:var(--pu);font-weight:700}
.sl-logo{height:24px}
/* cover */
.sl-cover{background:#55348b;color:#fff;display:grid;grid-template-columns:1fr 470px}
.cv-l{position:relative;padding:72px 0 0 76px}
.cv-client{height:56px;display:flex;align-items:center}
.cv-client img{max-height:52px;max-width:360px;object-fit:contain}
.cv-client span{font-size:30px;font-weight:700}
.cv-bar{width:48px;height:5px;background:#f2b705;margin:52px 0 22px;border-radius:3px}
.cv-kicker{color:#f2b705;font-size:22px;font-weight:700}
.cv-title{font-size:76px;font-weight:900;line-height:1.16;margin:18px 0 26px;letter-spacing:-.02em}
.cv-sub{font-size:20px;line-height:1.75;color:rgba(255,255,255,.88)}
.cv-hsg{position:absolute;left:76px;bottom:72px;height:42px}
.cv-r{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:116px;gap:16px;padding:18px 32px 18px 0;align-content:center}
.cv-tile{border-radius:12px;padding:16px 16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cv-tile b{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em}
.cv-tile span{font-size:17px;font-weight:700;line-height:1.35;max-height:46px;overflow:hidden}
.cv-tile.t0{background:#fff;color:#55348b}
.cv-tile.t1{background:#6b4ba1;color:#fff}
.cv-tile.t2{background:#efe9f7;color:#3d2468}
.cv-tile.t3{background:#f2b705;color:#2a1d00}
/* overview */
.ov-grid{display:grid;gap:22px;margin-top:30px}
.ov-card{padding:28px 30px 26px;height:494px;display:flex;flex-direction:column}
.ov-card .badge{align-self:flex-start}
.ov-card.many .ov-num b{font-size:60px}
.ov-card.many .ov-num{margin:6px 0 12px;padding-bottom:12px}
.ov-card.many .ov-bars{gap:7px}
.ov-name{font-size:22px;font-weight:800;line-height:1.4;margin-top:16px;min-height:62px}
.ov-num{display:flex;align-items:baseline;gap:6px;margin:10px 0 16px;padding-bottom:18px;border-bottom:1px solid #e6e2ec}
.ov-num b{font-family:Montserrat,sans-serif;font-weight:800;font-size:76px;line-height:1;color:var(--pu);letter-spacing:-.03em}
.ov-num em{font-style:normal;font-size:22px;font-weight:800;color:var(--pu)}
.ov-num span{font-size:18px;color:var(--sub)}
.ov-bars{display:flex;flex-direction:column;gap:12px}
.ov-bar{display:grid;grid-template-columns:76px 1fr 24px;align-items:center;gap:10px;font-size:15px}
.ov-bar i{height:12px;border-radius:999px;display:block;min-width:6px}
.ov-bar b{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px}
.ov-desc{margin:auto 0 0;padding-top:14px;font-size:15px;line-height:1.65;color:var(--sub);max-height:90px;overflow:hidden}
.ov-desc b{color:var(--ink)}
/* list */
.sl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.kick{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:16px;margin-bottom:8px}
.big{display:flex;align-items:baseline;gap:4px;color:var(--pu);white-space:nowrap}

<div id="toastRoot"></div>
<button type="button" id="toTop" class="to-top" aria-label="맨 위로" title="맨 위로" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
const S = {videos:[], modules:[], links:[], instructors:[], loaded:{v:false,m:false,l:false,i:false},
  view:'search', q:'', f:{kind:'',module:'',inst:'',status:'사용'}, sort:'code', shown:60,
  mod:null, reason:'', canWrite:true, db:null, user:null, sample:null, uid:null, open:null, editing:false};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CODE_RE = /^[PHC]\d{3}(-\d+)?$/;
const KIND = {P:'성과백신', H:'판매용', C:'기업맞춤'};
const STATUSES = ['사용','제작 중','미사용','삭제','리뉴얼로 대체됨'];
const isTemp = c => /^T-/.test(c||'');
const codeBadge = (code, kind) => isTemp(code) ? '<span class="pill warn">제작 중</span>' : `<span class="code ${esc(kind)}">${esc(code)}</span>`;
const secs = d => { const p = String(d||'').split(':').map(Number); if (p.some(isNaN) || !d) return -1; return p.reduce((a,b)=>a*60+b,0); };
const fmtDur = d => { const s = secs(d); if (s<0) return d||''; const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); };
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function toast(msg){ const r=$('#toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML='',2600); }

/* ---------- derived ---------- */
function modName(id){ return (S.modules.find(m=>m.id===id)||{}).name || id; }
function videoModules(v){ return S.links.filter(l=>l.code===v.code).map(l=>modName(l.module)); }
function instSet(){ return new Set(S.instructors.map(i=>i.id)); }
function reasonsFor(v, ctx){
  const r=[];
  if (v.status==='제작 중') return r;
  if (!CODE_RE.test(v.code||'')) r.push('번호 형식 오류');
  if (v.status==='사용' && ctx.activeByCode[v.code]>1) r.push('중복 번호');
  if (v.status!=='사용') return r;
  if (!v.link) r.push('링크 없음');
  if (!v.instructor || !ctx.inst.has(v.instructor)) r.push('강사 확인');
  if (!(v.summary||'').trim()) r.push('내용 요약 없음');
  if (v.kind!=='C' && !ctx.linked.has(v.code)) r.push('모듈 미연결');
  if (!v.duration || !v.date) r.push('정보 직접 입력');
  return r;
}
function ctx(){
  const activeByCode={}; S.videos.forEach(v=>{ if(v.status==='사용') activeByCode[v.code]=(activeByCode[v.code]||0)+1; });
  return {activeByCode, inst:instSet(), linked:new Set(S.links.map(l=>l.code).filter(Boolean))};
}
function linkProblems(){
  const byCode={}; S.videos.forEach(v=>{ (byCode[v.code] ||= []).push(v); });
  return S.links.map(l=>{
    if (!l.code) return {l, why:'번호 없음 (미제작?)'};
    const vs=byCode[l.code]; if(!vs) return {l, why:'없는 번호'};
    if (!vs.some(v=>v.status==='사용')) return vs.some(v=>v.status==='제작 중')? null : {l, why:'삭제·대체된 영상'};
    return null;
  }).filter(Boolean);
}

/* ---------- views ---------- */
function setView(v){ S.view = v; document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current', a.dataset.v===v?'page':'false')); render(); }
window.addEventListener('hashchange', ()=>setView((location.hash||'#search').slice(1)||'search'));

function render(){
  const ready = S.loaded.v && S.loaded.m && S.loaded.l && S.loaded.i;
  const c = ctx(); const nCheck = S.videos.filter(v=>reasonsFor(v,c).length).length + linkProblems().length;
  $('#checkCount').textContent = nCheck;
  if (!S.db){ $('#app').innerHTML = `<div class="empty">이 화면에서는 데이터 저장소에 연결할 수 없습니다. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.</div>`; return; }
  if (!ready){ return; }
  if (!S.videos.length && S.view!=='add'){ $('#app').innerHTML = `<div class="empty"><h2>아직 등록된 영상이 없습니다</h2><p>기존 시트 데이터가 옮겨지면 여기에 P·H·C 영상이 나타납니다. 새 영상은 <a href="#add">영상 등록</a>에서 추가할 수 있습니다.</p></div>`; return; }
  ({search:viewSearch, catalog:viewCatalog, recommend:viewCatalog, modules:viewModules, check:viewCheck, add:viewAdd, admin:viewAdmin}[S.view] || viewSearch)(c);
}

function filtered(){
  const q = S.q.trim().toLowerCase();
  let a = S.videos.filter(v=>{
    if (S.f.kind && v.kind!==S.f.kind) return false;
    if (S.f.status && v.status!==S.f.status) return false;
    if (S.f.inst && v.instructor!==S.f.inst) return false;
    if (S.f.module && !S.links.some(l=>l.module===S.f.module && l.code===v.code)) return false;
    if (!q) return true;
    return [v.code,v.title,v.summary,v.client,v.course,v.category,v.instructor].join(' ').toLowerCase().includes(q);
  });
  const cmp = {
    code:(x,y)=>x.code.localeCompare(y.code,'en',{numeric:true}) || (x.date||'').localeCompare(y.date||''),
    new:(x,y)=>(y.date||'').localeCompare(x.date||''),
    old:(x,y)=>(x.date||'').localeCompare(y.date||''),
    long:(x,y)=>secs(y.duration)-secs(x.duration),
    short:(x,y)=>{ const a=secs(x.duration), b=secs(y.duration); return (a<0)-(b<0) || a-b; },
  }[S.sort];
  return a.sort(cmp);
}
function opt(v, label, cur){ return `<option value="${esc(v)}"${v===cur?' selected':''}>${esc(label)}</option>`; }
function viewSearch(){
  const res = filtered();
  const mods = S.modules.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  $('#app').innerHTML = `
  <div class="searchrow"><div class="q"><input id="q" type="search" placeholder="일련번호, 제목, 내용, 고객사로 검색" value="${esc(S.q)}" aria-label="검색어"></div>
    <select id="sort" aria-label="정렬" style="width:auto">${opt('code','번호순',S.sort)}${opt('new','최신 제작순',S.sort)}${opt('old','오래된 순',S.sort)}${opt('long','길이 긴 순',S.sort)}${opt('short','길이 짧은 순',S.sort)}</select></div>
  <div class="filters">
    <label><span class="label">구분</span><select id="fKind">${opt('','전체',S.f.kind)}${opt('P','P 성과백신',S.f.kind)}${opt('H','H 판매용',S.f.kind)}${opt('C','C 기업맞춤',S.f.kind)}</select></label>
    <label><span class="label">모듈</span><select id="fModule">${opt('','전체',S.f.module)}${mods.map(m=>opt(m.id,m.name,S.f.module)).join('')}</select></label>
    <label><span class="label">강사</span><select id="fInst">${opt('','전체',S.f.inst)}${S.instructors.map(i=>opt(i.id, i.name? `${i.id} · ${i.name}`: i.id, S.f.inst)).join('')}</select></label>
    <label><span class="label">상태</span><select id="fStatus">${opt('','전체',S.f.status)}${STATUSES.map(s=>opt(s,s,S.f.status)).join('')}</select></label>
  </div>
  <div class="resultbar"><span><b>${res.length}</b>개 영상${S.q||S.f.kind||S.f.module||S.f.inst?' 검색됨':''}</span>
    ${(S.q||S.f.kind||S.f.module||S.f.inst||S.f.status!=='사용')?'<button class="ghost" id="reset">필터 초기화</button>':''}</div>
  <div class="list" role="list">
    <div class="row head"><span>번호</span><span>제목 · 내용</span><span class="hide-s">모듈</span><span class="hide-s">강사</span><span>길이</span><span class="hide-s">제작일자</span></div>
    ${res.slice(0,S.shown).map(rowHtml).join('') || '<div class="empty">조건에 맞는 영상이 없습니다. 검색어나 필터를 바꿔 보세요.</div>'}
  </div>
  ${res.length>S.shown?`<div class="more"><button id="more">${res.length-S.shown}개 더 보기</button></div>`:''}`;
  const q=$('#q'); q.oninput=()=>{ S.q=q.value; S.shown=60; clearTimeout(viewSearch.t); viewSearch.t=setTimeout(()=>{ const pos=q.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); },180); };
  $('#sort').onchange=e=>{S.sort=e.target.value; render();};
  $('#fKind').onchange=e=>{S.f.kind=e.target.value;S.shown=60;render();};
  $('#fModule').onchange=e=>{S.f.module=e.target.value;S.shown=60;render();};
  $('#fInst').onchange=e=>{S.f.inst=e.target.value;S.shown=60;render();};
  $('#fStatus').onchange=e=>{S.f.status=e.target.value;S.shown=60;render();};
  $('#reset')?.addEventListener('click',()=>{S.q='';S.f={kind:'',module:'',inst:'',status:'사용'};render();});
  $('#more')?.addEventListener('click',()=>{S.shown+=100;render();});
  bindRows();
}
function rowHtml(v){
  const sub = (v.summary||'').trim().split('\n')[0] || (v.kind==='C' ? [v.client,v.course].filter(Boolean).join(' · ') : '');
  const st = v.status!=='사용' && !isTemp(v.code) ? ` <span class="pill ${v.status==='삭제'?'bad':'warn'}"${v.remark?` title="${esc(v.remark)}"`:''}>${esc(v.status)}</span>`:'';
  const pv = v.kind==='H' ? (v.related||[]).filter(c=>/^P\d{3}/.test(c)) : [];
  const pb = pv.map(c=>`<span class="code P" title="같은 내용의 성과백신 영상">${esc(c)}</span>`).join('');
  return `<div class="row" role="listitem" tabindex="0" data-id="${esc(v.id)}">
    <span class="codes">${codeBadge(v.code, v.kind)}${pb}</span>
    <span class="t"><b>${esc(v.title)}${st}</b><span>${esc(sub)}</span></span>
    <span class="hide-s mod-cell" title="${esc(videoModules(v).join(', '))}">${esc(videoModules(v).join(', ')||'—')}</span>
    <span class="mono hide-s">${esc(v.instructor||'—')}</span>
    <span class="mono">${esc(fmtDur(v.duration)||'—')}</span>
    <span class="mono hide-s">${esc(v.date||'—')}</span></div>`;
}
function bindRows(root=document){
  root.querySelectorAll('[data-id]').forEach(el=>{
    el.onclick=()=>openSheet(el.dataset.id);
    el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); openSheet(el.dataset.id);} };
  });
}

function catClean(data){
  const by=catByCode();
  const comps=(Array.isArray(data?.competencies)?data.competencies:[]).map(x=>String(x||'').trim()).filter(Boolean).slice(0,5);
  const specs=catSpecs();
  const plans=(Array.isArray(data?.plans)?data.plans:[]).slice(0,specs.length).map((p,pi)=>{
    const used=new Set();
    const groups=(Array.isArray(p?.groups)?p.groups:[]).map(g=>({competency:String(g?.competency||'').trim()||'기타',
      codes:(Array.isArray(g?.codes)?g.codes:[]).map(c=>String(c||'').trim().toUpperCase()).filter(c=>by[c] && !used.has(c) && used.add(c))})).filter(g=>g.codes.length);
    const s=k=>String(p?.[k]||'').trim();
    return {name:s('name'), type:s('type'), typeDesc:s('typeDesc'), headline:s('headline'), feature:s('feature'), reason:s('reason'),
      tags:(Array.isArray(p?.tags)?p.tags:[]).map(t=>String(t||'').replace(/^#/,'').trim()).filter(Boolean).slice(0,3), fit:s('fit'), fitNote:s('fitNote'), groups, spec:specs[pi],
      reserve:(Array.isArray(p?.reserve)?p.reserve:[]).map(r=>({competency:String(r?.competency||'').trim()||'기타', code:String(r?.code||'').trim().toUpperCase()})).filter(r=>by[r.code] && !used.has(r.code))};
  }).filter(p=>p.groups.length);
  plans.forEach(p=>{ if (p.spec?.unit==='시간') fitTime(p, by, comps); delete p.reserve; });
  plans.forEach(p=>p.groups.forEach(g=>{ if(!comps.includes(g.competency)) comps.push(g.competency); }));
  return {coverLine:String(data?.coverLine||'').trim() || comps.join(' · ')+' 역량별 큐레이션', competencies:comps, plans};
}
function fitTime(p, by, comps){
  const target=p.spec.min*60, tol=300, d=c=>Math.max(0,secs(by[c].duration));
  let total=p.groups.reduce((s,g)=>s+g.codes.reduce((a,c)=>a+d(c),0),0);
  while (total>target+tol){
    let best=null;
    p.groups.forEach(g=>g.codes.forEach(c=>{ const gap=Math.abs(total-d(c)-target); if(!best||gap<best.gap) best={g,c,gap}; }));
    if (!best || best.gap>=Math.abs(total-target)) break;
    best.g.codes=best.g.codes.filter(x=>x!==best.c); total-=d(best.c);
  }
  while (total<target-tol && p.reserve.length){
    let bi=-1, bg=Infinity;
    p.reserve.forEach((r,i)=>{ const gap=Math.abs(total+d(r.code)-target); if(gap<bg){bg=gap;bi=i;} });
    if (bg>=Math.abs(total-target)) break;
    const r=p.reserve.splice(bi,1)[0];
    let g=p.groups.find(x=>x.competency===r.competency);
    if (!g){ g={competency:r.competency, codes:[]}; p.groups.push(g); if(!comps.includes(r.competency)) comps.push(r.competency);
      p.groups.sort((a,b)=>comps.indexOf(a.competency)-comps.indexOf(b.competency)); }
    g.codes.push(r.code); total+=d(r.code);
  }
  p.groups=p.groups.filter(g=>g.codes.length);
}
async function catFillTexts(){
  const by=catByCode();
  const codes=[...new Set(CAT.data.plans.flatMap(p=>p.groups.flatMap(g=>g.codes)))].filter(c=>!(by[c].target&&by[c].pitch) && !(CAT.vt[c]?.target && CAT.vt[c]?.pitch));
  if (!codes.length || !S.sample) return;
  CAT.stage=`영상 ${codes.length}편의 추천 대상과 요약을 쓰는 중입니다…`; render();
  const list=codes.map(c=>`${c} | ${by[c].title} | ${(by[c].summary||'').replace(/\s+/g,' ').slice(0,500)}`).join('\n');
  const prompt=`아래 리더십 교육 영상마다 카탈로그 문구 두 가지를 한국어로 써라.
- target(추천 대상): 15~35자 명사구, "리더"/"팀장"/"구성원"/"직장인" 같은 사람 명사로 끝남
- pitch(요약): 두 문장 90~150자, 합니다체. 첫 문장은 필요나 문제, 둘째 문장은 "본 영상에서는"으로 시작해 배우는 내용을 쓰고 "학습합니다." 또는 "소개합니다."로 끝냄
- 제목과 요약에 있는 내용만 쓴다.
JSON 하나로만 답하라: {"H025":{"target":"","pitch":""}}
영상 (번호 | 제목 | 내용 요약):
${list}`;
  try{
    const out=await S.sample.json(prompt,{modelTier:'default', cache:false, signal:CAT.ctl?.signal});
    for (const c of codes){ const o=out?.[c]; if(!o?.target||!o?.pitch) continue;
      CAT.vt[c]={target:String(o.target), pitch:String(o.pitch)};
      if (S.canWrite){ const v=by[c]; S.db.doc('videos/'+v.id).update({target:String(o.target), pitch:String(o.pitch)}).catch(()=>{}); }
    }
  }catch(e){ if(e?.code==='cancelled') throw e; }
}
async function runCatalog(){
  if (CAT.busy) return;
  if (!catSpecs().length){ CAT.err='추천안의 편수나 시간을 하나 이상 넣어 주세요. (시간은 20시간, 편수는 60편까지)'; render(); return; }
  if (!CAT.f.purpose.trim() && !CAT.f.comps.trim()){ CAT.err='교육 목적이나 다룰 역량 중 하나는 넣어 주세요.'; render(); return; }
  if (!S.sample){ CAT.err='이 화면에서는 AI 기능을 쓸 수 없습니다. claude.ai에 로그인한 상태로 열어 주세요.'; render(); return; }
  const list=catVideos();
  let cut=260, prompt=catPrompt(list,cut);
  while (new TextEncoder().encode(prompt).length>240000 && cut>40){ cut-=30; prompt=catPrompt(list,cut); }
  CAT.busy=true; CAT.err=''; CAT.data=null; CAT.vt={}; CAT.stage='AI가 추천안을 구성하는 중입니다… 보통 30초~1분 걸립니다'; CAT.ctl=new AbortController(); render();
  try{
    const data=await S.sample.json(prompt,{modelTier:'default', signal:CAT.ctl.signal, cache:false,
      onText:({text})=>{ const el=$('#catLive'); if(el) el.textContent=`추천안 작성 중… ${text.length.toLocaleString()}자`; }});
    CAT.data=catClean(data);
    if (!CAT.data.plans.length) throw {code:'empty_completion'};
    await catFillTexts();
  }catch(e){
    CAT.data = e?.code==='cancelled'? null : CAT.data;
    CAT.err = e?.code==='cancelled' ? '' : e?.code==='not_granted' ? 'AI 사용이 허용되지 않았습니다. 페이지의 권한 메뉴에서 허용한 뒤 다시 시도해 주세요.'
      : e?.code==='rate_limited' ? '요청이 많습니다. 잠시 후 다시 시도해 주세요.'
      : (e?.code==='invalid_json'||e?.code==='empty_completion') ? '추천 결과를 읽지 못했습니다. 다시 시도해 주세요.' : '카탈로그를 만들지 못했습니다. 잠시 후 다시 시도해 주세요.';
  }finally{ CAT.busy=false; CAT.ctl=null; CAT.stage=''; render(); }
}

function catSet(key, val){

  if (parts[0]==='f'){ CAT.f[parts[1]]=val; return; }
  if (parts[0]==='contact'){ CAT.contact[parts[1]]=val; saveContact(); return; }
  if (key==='quote.note'){ CAT.quote.note=val; saveContact(); return; }
  let o=CAT; for (let i=0;i<parts.length-1;i++){ o=o[parts[i]]; if(o==null) return; }
  const last=parts[parts.length-1];
  if (/^tags$/.test(parts[parts.length-2])) o[+last]=val.replace(/^#/,''); else o[last]=val;
}

function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>ok(); s.onerror=()=>no(new Error('script')); document.head.appendChild(s); }); }
async function catPdf(){
  if (!CAT.data || CAT.pdfBusy) return;
  if (!S.downloads){ toast('이 화면에서는 파일을 내려받을 수 없습니다'); return; }
  const btn=()=>$('#catPdf');
  const msg=t=>{ CAT.pdfMsg=t; const b=btn(); if(b){ b.textContent=t; b.disabled=true; } };
  CAT.pdfBusy=true; msg('PDF 준비 중…');
  let host=null;
  try{
    if (!window.html2canvas) await loadScript(H2C_URL);
    if (!window.jspdf) await loadScript(JSPDF_URL);
    if (document.fonts?.ready) await document.fonts.ready;
    host=document.createElement('div'); host.className='cat-capture';
    host.innerHTML=slidesHtml(false).join(''); document.body.appendChild(host);
    await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete? Promise.resolve() : new Promise(r=>{ im.onload=im.onerror=r; })));
    const slides=[...host.querySelectorAll('.sl')];
    const pdf=new window.jspdf.jsPDF({orientation:'landscape', unit:'px', format:[1280,720], hotfixes:['px_scaling'], compress:true});
    for (let i=0;i<slides.length;i++){
      msg(`PDF 만드는 중… ${i+1}/${slides.length}`);
      const c=await window.html2canvas(slides[i],{scale:1.6, backgroundColor:'#ffffff', logging:false, width:1280, height:720, windowWidth:1280});
      if (i) pdf.addPage([1280,720],'landscape');
      pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,1280,720,undefined,'FAST');
    }
    host.remove(); host=null;
    msg('저장 확인 대기 중…');
    const name=`HSG_영상카탈로그_${(CAT.f.company||'제안').replace(/[\\/:*?"<>|]/g,'')}_${today()}.pdf`;
    await S.downloads.save({filename:name, data:pdf.output('blob')});
    toast('PDF를 저장했습니다');
  }catch(e){
    toast(e?.code==='declined'? '저장을 취소했습니다' : e?.message==='script'? 'PDF 도구를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.' : 'PDF를 만들지 못했습니다. 다시 시도해 주세요.');
  }finally{ host?.remove(); CAT.pdfBusy=false; CAT.pdfMsg=''; const b=btn(); if(b){ b.disabled=false; b.textContent='PDF 내려받기'; } }
}

function viewModules(){

  const cur = S.links.filter(l=>l.module===S.mod).sort((a,b)=>a.pos-b.pos);
  const byCode={}; S.videos.forEach(v=>{ if(!byCode[v.code] || v.status==='사용') byCode[v.code]=v; });
  const total = cur.reduce((s,l)=>{ const v=byCode[l.code]; return s+(v? Math.max(0,secs(v.duration)):0); },0);
  $('#app').innerHTML = `<h1>모듈별 보기</h1><p class="sub">표준 영상 모듈 리스트 V.4 기준 ${S.modules.length}개 강의. 강의를 고르면 편성 순서대로 영상을 보여 줍니다.</p>

    <div style="min-width:0;display:flex;flex-direction:column;gap:10px">

      <div class="steps">${cur.map((l,i)=>{ const v=byCode[l.code];
        const state = !l.code? '<span class="pill warn">미제작 · 번호 없음</span>' : !v? '<span class="pill bad">없는 번호</span>' : v.status==='제작 중'? (isTemp(l.code)?'':'<span class="pill warn">제작 중</span>') : v.status!=='사용'? `<span class="pill bad">${esc(v.status)}</span>`:'';
        return `<div class="step${v?' clickable':''}" ${v?`data-id="${esc(v.id)}" tabindex="0"`:''}>
          <span class="pos">${i+1}</span>
          <span>${l.code? codeBadge(l.code, v?v.kind:l.code[0]) :'<span class="pill">—</span>'}</span>
          <span class="t" style="min-width:0"><b style="font-weight:600">${esc(v? v.title : l.label)}</b> ${state}<br><span class="hint">${esc(v? [v.instructor, fmtDur(v.duration)].filter(Boolean).join(' · ') : (l.desc||'').split('\n')[0])}</span></span>
          </div>`;}).join('') || '<div class="empty">이 강의에 연결된 영상이 없습니다. 영상 상세에서 이 모듈을 추가하면 여기에 나타납니다.</div>'}</div>
    </div></div>`;
  const ml = document.querySelector('.mlist'); if (ml) ml.scrollTop = keepScroll;
  if (viewModules.focus){ document.querySelector(`[data-m="${viewModules.focus}"]`)?.focus({preventScroll:true}); viewModules.focus=null; }

/* check */
function viewCheck(c){
  const items = S.videos.map(v=>({v, r:reasonsFor(v,c)})).filter(x=>x.r.length);
  const lp = linkProblems();
  const counts={}; items.forEach(x=>x.r.forEach(r=>counts[r]=(counts[r]||0)+1));
  const order=['번호 형식 오류','중복 번호','링크 없음','강사 확인','모듈 미연결','정보 직접 입력','내용 요약 없음'];
  const list = S.reason==='모듈 연결 오류'? [] : items.filter(x=>!S.reason || x.r.includes(S.reason));
  $('#app').innerHTML = `<h1>확인 필요</h1><p class="sub">빠진 칸이나 맞지 않는 값이 있는 영상입니다. 항목을 열어 고치면 목록에서 사라집니다.</p>
  <div class="reasons"><button aria-pressed="${!S.reason}" data-r="">전체 ${items.length}</button>${order.filter(r=>counts[r]).map(r=>`<button aria-pressed="${S.reason===r}" data-r="${esc(r)}">${esc(r)} ${counts[r]}</button>`).join('')}
    ${lp.length?`<button aria-pressed="${S.reason==='모듈 연결 오류'}" data-r="모듈 연결 오류">모듈 연결 오류 ${lp.length}</button>`:''}</div>
  ${S.reason==='모듈 연결 오류' ? `<div class="list">${lp.map(({l,why})=>`<div class="step"><span class="pos"></span><span>${l.code?`<span class="code ${esc(l.code[0])}">${esc(l.code)}</span>`:'—'}</span><span class="t" style="min-width:0"><b>${esc(modName(l.module))} ${l.pos}번</b> · ${esc(l.label)}<br><span class="pill bad">${esc(why)}</span></span></div>`).join('')}</div>`
  : `<div class="list">${list.slice(0,S.shown).map(({v,r})=>`<div class="row" tabindex="0" data-id="${esc(v.id)}" style="grid-template-columns:92px minmax(0,1fr)">
      <span><span class="code ${esc(v.kind)}">${esc(v.code)}</span></span>
      <span class="t"><b>${esc(v.title)}</b><span class="pills" style="white-space:normal">${r.map(x=>`<span class="pill ${'warn'}">${esc(x)}</span>`).join('')}</span></span></div>`).join('') || '<div class="empty">확인할 영상이 없습니다.</div>'}</div>
    ${list.length>S.shown?`<div class="more"><button id="more">${list.length-S.shown}개 더 보기</button></div>`:''}`}`;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.reason=b.dataset.r;S.shown=60;render();});
  $('#more')?.addEventListener('click',()=>{S.shown+=100;render();});
  bindRows($('#app'));
}

async function docxText(file){
  const zip = await JSZip.loadAsync(file); const xml = await zip.file('word/document.xml').async('string');
  const t = xml.replace(/<w:tab\/>/g,'\t').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');
  const ta=document.createElement('textarea'); ta.innerHTML=t; return ta.value;
}
function bindKeymsg(p, get, set, titleFn, onScript){

    if (!S.sample){ st.textContent='AI 초안 기능을 이 화면에서 쓸 수 없습니다. 직접 입력해 주세요.'; return; }
    text = text.trim().slice(0, 30000); if (text.length<40){ st.textContent='스크립트 내용이 너무 짧습니다.'; return; }
    st.textContent='AI가 내용 요약 초안을 쓰는 중입니다…';
    try{
      const prompt = `너는 HSG(휴먼솔루션그룹)의 리더십 교육 영상 편집자다. 아래 강의 스크립트를 읽고 영상의 내용 요약을 한국어로 써라.
형식: 첫 줄에 핵심 키워드를 쉼표로 2~4개(예: "건설적 갈등, 적시&직접 대립"), 빈 줄, 그 아래 핵심 내용을 3~4묶음으로 짧게 쓴다. 각 묶음은 "• 질문 문장" 한 줄과, 그 아래 답을 줄마다 "  - 내용" 형식의 글머리표로 쓴다. 단계·순서·개수가 있는 내용(예: 3가지 방법)은 "  1) 내용", "  2) 내용"처럼 번호로 쓴다. "〮", "→" 기호는 쓰지 않는다. 묶음 사이는 빈 줄로 구분한다.
분량: 묶음마다 답은 1~3줄, 한 줄은 40자 안팎의 짧은 요점으로 쓴다. 사례, 인용, 수치, 부연 설명은 빼고 핵심 개념과 방법만 남긴다. 키워드 줄을 빼고 전체 350~500자 안팎으로 맞춘다. 필요하면 마지막에 핵심 메시지 한 줄을 덧붙인다.
예시:
관찰, 피드백

• 좋은 리더가 되려면 무엇이 필요한가?
  - 조직이 요구하는 성과를 달성한다
  - 구성원이 성장하도록 돕는다

• 구성원을 성장시키는 방법은?
  1) 관찰하기
  2) 역량(KSA) 키워주기
규칙: 스크립트에 있는 개념과 표현만 쓰고, 설명이나 머리말 없이 본문만 출력하라.
영상 제목: ${titleFn()||'(미정)'}
스크립트:
${text}`;
      const r = await S.sample(prompt, {modelTier:'default'});
      const out = (r.text||'').trim();
      km.value = out; set(out);
      st.textContent='AI 초안입니다. 읽어 보고 고친 뒤 저장하세요.';
    }catch(err){ st.textContent = err?.code==='not_granted' ? 'AI 사용이 허용되지 않았습니다. 직접 입력해 주세요.' : err?.code==='rate_limited' ? '요청이 많습니다. 잠시 후 다시 시도해 주세요.' : '초안을 만들지 못했습니다. 다시 시도하거나 직접 입력해 주세요.'; }
  };
  $('#'+p+'File').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ const text = /\.docx$/i.test(f.name)? await docxText(f) : await f.text(); if(onScript) onScript(text.replace(/\r/g,'').trim(), f.name); await gen(text); }

  $('#'+p+'Gen').onclick=()=>gen($('#'+p+'Script').value);
}
function moduleChips(p, list){

function bindModuleChips(p, list, after){

function bars(rows){

  return `<div class="bars">${rows.map(r=>`<div class="bar-row"><span class="bar-l" title="${esc(r.label)}">${esc(r.label)}</span><span class="bar-t"><span class="bar-f${r.n?'':' zero'}" style="width:${(r.n/max*100).toFixed(1)}%"></span></span><span class="bar-n">${r.n}</span><span class="bar-s">${esc(r.sub||'')}</span></div>`).join('')}</div>`;
}
function hm(sec){ const h=Math.floor(sec/3600), m=Math.round(sec%3600/60); return h? `${h}시간 ${m}분` : `${m}분`; }

function statModules(){

}

async function filesFromInput(fileList){
  const out=[];
  for (const f of fileList){
    if (/\.zip$/i.test(f.name)){
      const zip=await JSZip.loadAsync(f);
      for (const [name,e] of Object.entries(zip.files)){ if(e.dir || !/\.(jpe?g|png|webp)$/i.test(name) || /(^|\/)(__MACOSX|\.)/.test(name)) continue;
        const b=await e.async('blob'); out.push(new File([b], name.split('/').pop(), {type: /png$/i.test(name)?'image/png':/webp$/i.test(name)?'image/webp':'image/jpeg'})); }
    } else if (/^image\//.test(f.type)) out.push(f);
  }
  return out;
}
async function bulkThumbs(fileList){
  if (BULK.busy) return; BULK.busy=true; BULK.log='파일을 읽는 중…'; render();
  const logEl=()=>$('#bulkLog'); const say=s=>{ BULK.log=s; const el=logEl(); if(el){ el.textContent=s; el.scrollTop=el.scrollHeight; } };
  try{
    const files=await filesFromInput(fileList);
    const by={}; thumbTargets().forEach(v=>by[v.code]=v);
    let ok=0, skip=0, bad=[], lines=[];
    for (let i=0;i<files.length;i++){
      const f=files[i], m=f.name.match(/^([PHC])\s*0*(\d{1,3})(-\d+)?/i);
      const code=m? m[1].toUpperCase()+String(+m[2]).padStart(3,'0')+(m[3]||'') : '';
      const v=by[code];
      if (!v){ bad.push(`${f.name}: 사용 중인 영상 번호를 찾지 못함`); continue; }
      if (BULK.onlyMissing && v.thumb){ skip++; continue; }
      say(`${i+1}/${files.length} ${code} 올리는 중…\n`+lines.slice(-6).join('\n'));
      try{ await putThumb(v,f); v.thumb='pending'; ok++; lines.push(`${code} 완료`); }
      catch(e){ bad.push(`${f.name}: ${thumbErr(e)}`); if(e?.code==='quota_or_state') break; }
    }
    BULK.log=`끝났습니다 · 저장 ${ok}편${skip?` · 이미 있어 건너뜀 ${skip}편`:''}${bad.length?` · 실패 ${bad.length}건\n`+bad.join('\n'):''}`;
  }catch(e){ BULK.log='파일을 읽지 못했습니다. 이미지 파일이나 .zip 파일인지 확인해 주세요.'; }
  finally{ BULK.busy=false; render(); }
}

async function shrinkImage(file, maxW=960){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const s=Math.min(1, maxW/img.naturalWidth), w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.86));
  } finally { URL.revokeObjectURL(url); }
}
function thumbErr(e){
  const c=e?.code;
  if (c==='quota_or_state') return '사이트 이미지 저장 공간이 가득 찼습니다';
  if (c==='too_large') return '이미지가 너무 큽니다';
  if (c==='unsupported_type') return '이미지 파일(JPG·PNG)만 올릴 수 있습니다';
  if (c==='not_granted') return '이미지 저장 권한이 허용되지 않았습니다';
  if (c==='rate_limited'||c==='store_unavailable') return '잠시 후 다시 시도해 주세요';
  return '썸네일을 저장하지 못했습니다';
}
async function putThumb(v, file){
  if (!S.assets) throw {code:'not_granted'};
  const blob=await shrinkImage(file);
  const up=await S.assets.upload(blob,{type:'image/jpeg'});
  const old=v.thumb;
  await S.db.doc('videos/'+v.id).update({thumb:up.id});
  if (old && old!==up.id) S.assets.delete(old).catch(()=>{});
  return up.id;
}
async function dropThumb(v){

}

      if (pc) return finalizeTemp(v, nv, pc);

    const before = S.links.filter(l=>l.code===v.code);
    const add = editMods.filter(m=>!before.some(l=>l.module===m)), rm = before.filter(l=>!editMods.includes(l.module));
    try{

      for (const m of add) await addLink(m, v.code, nv.title);
      for (const l of rm) await S.db.doc('mlinks/'+l.id).delete();

    }catch(err){ writeFail(err); }
  };

async function deleteVideo(v){
  const keepLinks = S.videos.some(x=>x.code===v.code && x.id!==v.id);
  const links = keepLinks? [] : S.links.filter(l=>l.code===v.code);
  try{
    await S.db.doc('videos/'+v.id).delete();
    for (const l of links) await S.db.doc('mlinks/'+l.id).delete();
    if (v.thumb && S.assets) S.assets.delete(v.thumb).catch(()=>{});
  }catch(err){ writeFail(err); renderSheet(); return; }
  const label = isTemp(v.code)? `'${v.title}'` : v.code;
  closeSheet(); toast(`${label} 삭제했습니다`);
  removeSheetRow(v).then(m=>m&&toast(`${label} 삭제 · ${m}`)).catch(e=>toast(`${label} 삭제 · ${sheetErr(e).replace('반영','줄 삭제')}`));

async function removeSheetRow(v){
  if (v.kind!=='H' || isTemp(v.code)) return '';
  const mcp = await getMcp(); if (!mcp) throw {code:'capability_disabled'};
  const r = await mcp.callTool(SHEET.server,'get_values',{spreadsheetId:SHEET.id, range:`${SHEET.tab}!A1:C3000`},{cache:false});
  const rows = (r.payload && r.payload.values) || [];
  const idx = rows.findIndex((row,i)=> i>0 && (v.link ? row[2]===v.link : (!row[2] && row[0]===v.code && row[1]===v.title)));
  if (idx<0) return '구글 시트에는 해당 줄이 없었습니다';
  await mcp.callTool(SHEET.server,'update_spreadsheet',{spreadsheetId:SHEET.id, requests:[{deleteDimension:{range:{sheetId:SHEET.gid, dimension:'ROWS', startIndex:idx, endIndex:idx+1}}}]},{cache:false});
  return `구글 시트 ${idx+1}행도 지웠습니다`;
}
async function finalizeTemp(v, nv, code){
  const {id:_old, ...base} = v;
  const same=S.videos.filter(x=>x.code===code).length;
  const nid = same? `${code}~${same+1}` : code;
  const doc = {...base, ...nv, code, kind:code[0]};
  const before = S.links.filter(l=>l.code===v.code);
  try{
    await S.db.doc('videos/'+nid).set(doc);
    for (const l of before){ if (editMods.includes(l.module)) await S.db.doc('mlinks/'+l.id).update({code, label:nv.title}); else await S.db.doc('mlinks/'+l.id).delete(); }
    for (const m of editMods.filter(m=>!before.some(l=>l.module===m))) await addLink(m, code, nv.title);
    await S.db.doc('videos/'+v.id).delete();
    toast(`${code} 번호로 저장했습니다`);
    S.open=nid; S.editing=false; renderSheet();
    runSync(nid, doc, null, null, `${code} 저장`);
  }catch(err){ writeFail(err); }
}
function writeFail(err){
  if (err?.code==='invalid_argument'){ S.canWrite=false; render(); renderSheet(); toast('편집 권한이 없어 저장하지 못했습니다'); }
  else toast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
}

const SHEET = {id:'1z7ltlknl_3K9qT8xP21Sq0TSO8S1e0yoCho7SNnANgM', tab:'H영상', gid:677840313, server:'Google Sheets'};
let mcpP=null; const getMcp=()=> mcpP ||= claude.use('mcp');
function sheetErr(e){
  const c=e?.code;
  if (c==='server_not_connected'||c==='needs_reauth') return '구글 시트 반영 실패: claude.ai 설정 > 커넥터에서 Google Sheets 연결을 확인해 주세요';
  if (c==='not_in_manifest'||c==='approval_required'||c==='not_granted'||c==='consent_required') return '구글 시트 반영 실패: 이 페이지의 Google Sheets 사용이 허용되지 않았습니다';
  if (c==='capability_disabled'||c==='capability_removed') return '구글 시트 반영 실패: 이 화면에서는 시트에 연결할 수 없습니다';
  if (c==='tool_error') return '구글 시트 반영 실패: '+(e.message||'시트가 요청을 거절했습니다').slice(0,80);
  return '구글 시트 반영 실패: 영상 상세의 "다시 반영"으로 다시 시도해 주세요';
}
async function runSync(id, v, prevLink, prevTitle, label){
  const pre = label ? label+' · ' : '';
  const cur = () => S.videos.find(x=>x.id===id);
  try{
    const m = await syncSheet(v, prevLink, prevTitle);
    if (m) toast(pre+m); else if (!label) toast('시트에 반영할 내용이 없습니다');
    if (cur()?.sheetFail) await S.db.doc('videos/'+id).update({sheetFail:''}).catch(()=>{});
  }catch(e){
    toast(pre+sheetErr(e));
    await S.db.doc('videos/'+id).update({sheetFail:new Date().toISOString()}).catch(()=>{});
  }
}
async function syncSheet(v, prevLink, prevTitle){
  if (v.kind!=='H' || isTemp(v.code) || v.status==='제작 중') return '';
  const mcp = await getMcp(); if (!mcp) throw {code:'capability_disabled'};
  const r = await mcp.callTool(SHEET.server,'get_values',{spreadsheetId:SHEET.id, range:`${SHEET.tab}!A1:C3000`},{cache:false});
  const rows = (r.payload && r.payload.values) || [];
  const find = f => rows.findIndex((row,i)=> i>0 && f(row));
  let idx = v.link ? find(row=>row[2]===v.link) : -1;
  if (idx<0 && prevLink) idx = find(row=>row[2]===prevLink);
  // 링크 없는 줄: 일련번호 + (지금 제목 또는 바뀌기 전 제목)으로 찾기
  if (idx<0) idx = find(row=>!row[2] && row[0]===v.code && row[1]===v.title);
  if (idx<0 && prevTitle) idx = find(row=>!row[2] && row[0]===v.code && row[1]===prevTitle);
  const isNew = idx<0, rowNum = isNew ? rows.length+1 : idx+1, ri = rowNum-1;
  const used = v.status==='사용';
  const rng = (c0,c1)=>({sheetId:SHEET.gid, startRowIndex:ri, endRowIndex:ri+1, startColumnIndex:c0, endColumnIndex:c1});
  const requests = [];
  if (isNew) requests.push({copyPaste:{source:{sheetId:SHEET.gid,startRowIndex:1,endRowIndex:2,startColumnIndex:0,endColumnIndex:7}, destination:rng(0,7), pasteType:'PASTE_FORMAT'}}, {copyPaste:{source:{sheetId:SHEET.gid,startRowIndex:1,endRowIndex:2,startColumnIndex:5,endColumnIndex:6}, destination:rng(5,6), pasteType:'PASTE_DATA_VALIDATION'}});
  requests.push(used
    ? {repeatCell:{range:rng(0,7), cell:{userEnteredFormat:{}}, fields:'userEnteredFormat.backgroundColorStyle'}}
    : {repeatCell:{range:rng(0,7), cell:{userEnteredFormat:{backgroundColorStyle:{rgbColor:{red:0.85,green:0.85,blue:0.85}}}}, fields:'userEnteredFormat.backgroundColorStyle'}});
  requests.push({repeatCell:{range:rng(0,2), cell:{userEnteredFormat:{textFormat:{strikethrough:!used}}}, fields:'userEnteredFormat.textFormat.strikethrough'}});
  await mcp.callTool(SHEET.server,'update_spreadsheet',{spreadsheetId:SHEET.id, requests},{cache:false});
  await mcp.callTool(SHEET.server,'update_values',{spreadsheetId:SHEET.id, range:`${SHEET.tab}!A${rowNum}:G${rowNum}`,
    values:[[v.code, v.title||'', v.link||'', v.sheetModule||'', fmtDur(v.duration)||v.duration||'', used?'O':'X', used?'':(v.remark||'')]]},{cache:false});
  return isNew ? `구글 시트 ${rowNum}행에 추가했습니다` : `구글 시트 ${rowNum}행을 고쳤습니다`;
}

  claude.use('downloads').then(d=>{ S.downloads=d; }).catch(()=>{});
  claude.use('assets').then(a=>{ S.assets=a; render(); if(S.open && !S.editing) renderSheet(); }).catch(()=>{});
  const sub = (col, key, map) => db.collection(col).limit(1000).onSnapshot(snap=>{
    S[key] = snap.docs.map(d=>map(d.id, d.data())); S.loaded[key[0]] = true; render(); if(S.open && !S.editing) renderSheet();
  }, ()=>{ S.loaded[key[0]]=true; render(); });
  sub('videos','videos',(id,d)=>({id, ...d}));
  sub('modules','modules',(id,d)=>({id, ...d}));
  sub('mlinks','links',(id,d)=>({id, ...d}));
  sub('instructors','instructors',(id,d)=>({id, name:'', ...d}));
})();
})();
</script>
